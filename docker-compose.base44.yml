services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Source is bind-mounted; node_modules lives in a named volume and is synced
    # from package.json on every start before the dev server launches.
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || (echo 'vite dev server not responding' && exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  node_modules:
